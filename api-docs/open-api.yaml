openapi: 3.0.0
info:
  title: Devices Service API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /devices:
    get:
      summary: Получить информацию по всем устройствам пользователя
      operationId: getDevices
      tags:
        - devices
      responses:
        '200':
          description: Список устройств
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          description: Недостаточно прав доступа
        '404':
          description: Устройств не найдено
        '500':
          description: Внутренняя ошибка сервера
  /devices/{device_id}:
    get:
      summary: Получить информацию об устройстве
      operationId: getDeviceById
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
          description: Идентификатор устройства
      tags:
        - devices
      responses:
        '200':
          description: Информация о устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Недостаточно прав доступа
        '404':
          description: Устройство не найдено
        '500':
          description: Внутренняя ошибка сервера
  /telemetry/{device_id}:
    get:
      summary: Получить все последние показания телеметрии с устройства
      operationId: telemetryByDeviceId
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
          description: Идентификатор устройства
      tags:
        - telemetry
      responses:
        '200':
          description: Все последние показания телеметрии с устройства
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Telemetry'
        '404':
          description: Устройство не найдено
        '401':
          description: Недостаточно прав доступа
        '500':
          description: Внутренняя ошибка сервера
  /command:
    post:
      summary: Отправить команду устройству/датчику
      operationId: sendCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      tags:
        - commands
      responses:
        '200':
          description: Команда отправлена
        '400':
          description: Некорректный запрос
        '404':
          description: Устройство не найдено
        '401':
          description: Недостаточно прав доступа
        '500':
          description: Внутренняя ошибка сервера
components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serialNumber:
          type: string
        name:
          type: string
        softwareVersion:
          type: string
        roomId:
          type: string
          format: uuid
        registeredAt:
          type: string
          format: date-time
    Telemetry:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        value:
          type: string
        measuredAt:
          type: string
          format: date-time
    CommandRequest:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        value:
          type: string
tags:
  - name: devices
    description: Операции с устройствами
  - name: telemetry
    description: Операции с телеметрией
  - name: commands
    description: Операции с командами